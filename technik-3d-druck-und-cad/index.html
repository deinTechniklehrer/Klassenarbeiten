<body>
<title>Klassenarbeit 3D-Druck</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: schmale Prüfungsspalte, sticky Kopf mit Teil-Reitern, Aufgaben als offene Blöcke mit Punktangabe rechts */
:root{
  --bg:#eef3f7; --card:#ffffff; --ink:#14232f; --muted:#56687a; --line:#cfdae4;
  --blue:#035591; --accent:#035591; --accent-ink:#ffffff; --link:#035591; --yel:#F5B700; --yel-soft:#fff3c9;
  --ok:#17803f; --ok-bg:#e3f4e8; --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#c23b2e; --bad-bg:#fce8e5; --head:#023a63;
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051; --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --yel-soft:#3a3010; --ok:#4cc37c; --ok-bg:#12321f; --warn:#f0b95a; --warn-bg:#3a2d10; --bad:#ff8074; --bad-bg:#3a1a17; --head:#08131b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051; --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --yel-soft:#3a3010; --ok:#4cc37c; --ok-bg:#12321f; --warn:#f0b95a; --warn-bg:#3a2d10; --bad:#ff8074; --bad-bg:#3a1a17; --head:#08131b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
h1,h2,h3{font-family:var(--f-head);line-height:1.1;margin:0;text-wrap:balance}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:#fff}
header.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.tr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tr b{font-family:var(--f-head);font-size:1.35rem;letter-spacing:.01em}
.tr .who{margin-left:auto;font-size:.9rem;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{flex:none;color:#d8e6f2;text-decoration:none;padding:8px 14px;border-radius:6px 6px 0 0;font-weight:600;font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
.tabs .cnt{font-variant-numeric:tabular-nums;opacity:.75;font-weight:400;margin-left:6px}
main.wrap{padding-block:26px 70px}
.logos img{width:220px;height:auto;display:block}
.lg-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
:root[data-theme="dark"] .lg-l{display:none!important}:root[data-theme="dark"] .lg-d{display:block!important}
.intro{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.intro h1{font-size:clamp(2.1rem,6vw,3rem);color:var(--link)}
.intro p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:16px 0}
.panel h2{font-size:1.5rem;margin-bottom:8px}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
input[type=text],textarea,select{background:var(--card);border:2px solid var(--line);border-radius:5px;padding:9px 11px;min-height:46px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
table.parts{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.parts th,.parts td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.parts th{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.parts td.p,.parts th.p{text-align:right;white-space:nowrap}
.parts tfoot td{font-weight:700;border-bottom:none}
.status{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.status.go{background:var(--ok-bg);color:var(--ok)}.status.wait{background:var(--warn-bg);color:var(--warn)}
ol.rules{margin:6px 0 0;padding-left:1.3em}ol.rules li{margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 18px;border-radius:5px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--link)}
.btn.yel{background:var(--yel);border-color:var(--yel);color:#14232f}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.task{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:6px;padding:16px 18px 18px;margin:22px 0}
.task .th{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.task h2{font-size:1.45rem}
.task .pts{font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sub{margin:16px 0 6px;display:flex;justify-content:space-between;gap:10px}
.sub .pts{font-weight:600;font-size:.92rem}
.q{margin:0 0 8px}
.hint{font-size:.92rem;color:var(--muted)}
.note{border-left:5px solid var(--yel);background:var(--yel-soft);padding:10px 14px;border-radius:0 5px 5px 0;margin:10px 0}
.photo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:640px){.photo-grid{grid-template-columns:1fr}}
.photo{position:relative;background:#fff;border:1px solid var(--line);border-radius:5px;max-width:100%}
.photo img{display:block;width:100%;height:auto;border-radius:5px}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--yel);color:#14232f;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.bank{border:2px dashed var(--accent);border-radius:5px;padding:8px 12px;font-size:.95rem;margin-bottom:10px}
.lab{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.lab .n{width:30px;height:30px;border-radius:50%;background:var(--yel);color:#14232f;font-weight:800;display:grid;place-items:center}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline input{width:140px;min-width:0}
.pats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0}
.pats figure,.sides figure{margin:0;display:flex;flex-direction:column;gap:6px}
.pats svg,.sides svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:4px}
.pats figcaption,.sides figcaption{font-weight:800;text-align:center}
.sides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0}
@media(max-width:520px){.pats,.sides{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:5px;padding:8px 16px;cursor:pointer;font-weight:700;background:var(--card)}
.choice input{width:20px;height:20px;accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--accent)}
.saved{font-size:.85rem;color:var(--muted);min-height:1.3em}
.empty-part{text-align:center;padding:40px 18px}
.empty-part h2{font-size:1.8rem;margin-bottom:8px}
.check{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.check li{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:4px;background:var(--bg)}
.check li.miss{background:var(--warn-bg)}
.check li .ic{font-weight:800;width:1.2em;flex:none}
.check li.done .ic{color:var(--ok)}.check li.miss .ic{color:var(--warn)}
.preview{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:12px 14px;font-size:.95rem;max-height:420px;overflow:auto}
.preview h4{margin:12px 0 2px;font-size:1rem}
.preview .a{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:10px;margin:2px 0 6px}
.preview .a.e{border-color:var(--warn);color:var(--warn);font-style:italic}
.msg{margin-top:10px}
.msg div{padding:10px 14px;border-radius:5px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.msg div.bad{border-color:var(--bad);background:var(--bad-bg)}
.t2grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.t2grid{grid-template-columns:1fr}}
.viewer{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewer .vt{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer .vt button{border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:5px 10px;font-size:.88rem;font-weight:600;cursor:pointer;min-height:36px}
.viewer .vt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;aspect-ratio:4/3;max-width:100%;background:#fff}
.stage canvas,.stage img{display:block;width:100%;height:100%;object-fit:contain}
.stage .cap{position:absolute;left:8px;bottom:6px;font-size:.78rem;color:#56687a;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.facts div{background:var(--bg);border-radius:5px;padding:8px 10px}
.facts b{display:block;font-family:var(--f-head);font-size:1.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:.82rem;color:var(--muted)}
ol.steps2{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ol.steps2 li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
ol.steps2 li.done{border-color:var(--ok);background:var(--ok-bg)}
ol.steps2 .num{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-family:var(--f-head);font-size:1.2rem}
ol.steps2 li.done .num{background:var(--ok)}
ol.steps2 .tx b{display:block;font-size:1.02rem}
ol.steps2 .tx p{margin:2px 0 0}
ol.steps2 .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
ol.steps2 .rt .pts{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps2 label.dn{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
ol.steps2 label.dn input{width:20px;height:20px;accent-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-size:.8rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 9px}
.upl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
@media(max-width:600px){.upl{grid-template-columns:1fr}}
.upl div{border:2px solid var(--accent);border-radius:6px;padding:10px 14px}
.upl b{font-family:var(--f-head);font-size:1.3rem;display:block}
code.fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);padding:1px 6px;border-radius:3px}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
